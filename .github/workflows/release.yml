name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    name: AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 libx11-dev libudev-dev fuse libfuse2

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.1'
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/Release

      - name: Download linuxdeploy tools
        env:
          LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          LINUXDEPLOY_QT_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          LINUXDEPLOY_QT_SHA256: 15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724
        run: |
          mkdir -p "$HOME/.local/linuxdeploy-tools"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" "$LINUXDEPLOY_URL"
          curl -sL -o "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" "$LINUXDEPLOY_QT_URL"
          echo "$LINUXDEPLOY_SHA256  $HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" | sha256sum -c -
          echo "$LINUXDEPLOY_QT_SHA256  $HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage" | sha256sum -c -
          chmod +x "$HOME/.local/linuxdeploy-tools/linuxdeploy.AppImage" "$HOME/.local/linuxdeploy-tools/linuxdeploy-plugin-qt.AppImage"
          echo "$HOME/.local/linuxdeploy-tools" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/qml
          VERSION: ${{ github.ref_name }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          install -Dm644 LICENSE \
            AppDir/usr/share/licenses/io.github.filesfm.worktime/LICENSE
          linuxdeploy.AppImage --appdir AppDir \
            --executable build/Release/bin/worktime \
            --desktop-file resource/io.github.filesfm.worktime.desktop \
            --icon-file resource/icon.png \
            --icon-filename io.github.filesfm.worktime \
            --plugin qt \
            --output appimage
          mkdir -p dist
          appimage_file=$(ls -- *.AppImage)
          mv "$appimage_file" "dist/worktime-${VERSION}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:kde-6.7@sha256:aa2a9d3ca93244629ac56eb256b9ce4d04cf802ab9e501f25e9f75c5fd37bbae
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6.7
        with:
          bundle: worktime-${{ github.ref_name }}-x86_64.flatpak
          manifest-path: resource/flatpak/io.github.filesfm.worktime.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak
          path: worktime-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  snap:
    name: Snap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      - name: Rename snap
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # snapcraft.yaml uses `version: git`, so the built file name embeds
          # the commit SHA and changes on every run. Rename it to match the
          # other release artifacts so re-runs overwrite the same GitHub
          # Release asset instead of piling up a new one each time.
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" "dist/worktime-${VERSION}-amd64.snap"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap
          path: dist/*.snap
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password=$(openssl rand -base64 32)
          certificate_path="$RUNNER_TEMP/certificate.p12"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$certificate_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          # shellcheck disable=SC2046 # word-splitting is intentional: add to the existing search list
          security list-keychain -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$certificate_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.11.1'
          arch: clang_64
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build/Release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}

      - name: Build
        run: cmake --build build/Release

      - name: Deploy and sign app bundle
        run: |
          app_bundle=build/Release/bin/worktime.app
          macdeployqt "$app_bundle" -qmldir=src/qml -verbose=1

          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate." >&2
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp \
            --entitlements resource/macos/entitlements.plist \
            --sign "$identity" "$app_bundle"

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          dmg_path="dist/worktime-${VERSION}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "WorkTime" -srcfolder build/Release/bin/WorkTime.app -ov -format UDZO \
            "$dmg_path"

          identity=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          codesign --force --timestamp --sign "$identity" "$dmg_path"

      - name: Build PKG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          pkg_path="dist/worktime-${VERSION}-${{ matrix.arch }}.pkg"
          pkgbuild --component build/Release/bin/worktime.app \
            --install-location /Applications \
            --identifier io.github.filesfm.worktime \
            --version "${VERSION#v}" \
            "$pkg_path.unsigned"

          identity=$(security find-identity -v -p basic "$KEYCHAIN_PATH" \
            | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::No 'Developer ID Installer' identity found in the imported certificate." >&2
            exit 1
          fi

          productsign --sign "$identity" --timestamp "$pkg_path.unsigned" "$pkg_path"
          rm -f "$pkg_path.unsigned"

      - name: Notarize and staple DMG and PKG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for file in dist/*.dmg dist/*.pkg; do
            xcrun notarytool submit "$file" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$file"
          done

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.pkg
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          modules: 'qtshadertools'
          cache: true

      - name: Configure
        run: cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build/Release

      - name: Deploy Qt runtime
        run: |
          windeployqt --release --compiler-runtime --qmldir src/qml --no-translations \
            build/Release/bin/worktime.exe

      - name: Package portable ZIP
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          package_dir="worktime-${VERSION}-x64"
          cp -r build/Release/bin "$package_dir"
          cp LICENSE "$package_dir"
          7z a -tzip "dist/worktime-${VERSION}-x64.zip" "$package_dir" >/dev/null

      - name: Build NSIS installer
        env:
          VERSION: ${{ github.ref_name }}
          MSYS_NO_PATHCONV: '1'
        run: |
          version_number="${VERSION#v}"
          package_dir="$PWD/worktime-${VERSION}-x64"
          out_file="$PWD/dist/worktime-${VERSION}-x64-setup.exe"
          makensis.exe \
            /DVERSION="${version_number}" \
            /DSOURCE_DIR="$(cygpath -w "$package_dir")" \
            /DOUT_FILE="$(cygpath -w "$out_file")" \
            resource/windows/installer.nsi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  ubuntu:
    name: Ubuntu (deb)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          sed -i \
            -e 's|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
            -e 's|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources

          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev libx11-dev libudev-dev \
            dpkg-dev

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build/Release

      - name: Stage package contents
        run: |
          DESTDIR="$PWD/pkgroot" cmake --install build/Release

          install -Dm644 resource/io.github.filesfm.worktime.desktop \
            pkgroot/usr/share/applications/io.github.filesfm.worktime.desktop
          install -Dm644 resource/icon.svg \
            pkgroot/usr/share/icons/hicolor/scalable/apps/io.github.filesfm.worktime.svg
          install -Dm644 resource/icon.png \
            pkgroot/usr/share/icons/hicolor/128x128/apps/io.github.filesfm.worktime.png
          install -Dm644 resource/io.github.filesfm.worktime.metainfo.xml \
            pkgroot/usr/share/metainfo/io.github.filesfm.worktime.metainfo.xml
          install -Dm644 LICENSE \
            pkgroot/usr/share/doc/worktime/LICENSE

      - name: Build control file
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_number="${VERSION#v}"

          mkdir -p debian
          cp resource/debian/control debian/control
          shlibs_depends=$(dpkg-shlibdeps -O pkgroot/usr/bin/worktime | sed -n 's/^shlibs:Depends=//p')

          mkdir -p pkgroot/DEBIAN
          awk 'BEGIN{RS=""} NR==2' resource/debian/control \
            | sed -e "s|__VERSION__|${version_number}|" -e "s|__DEPENDS__|${shlibs_depends}|" \
            > pkgroot/DEBIAN/control

      - name: Build deb package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          dpkg-deb --root-owner-group --build pkgroot "dist/worktime-${VERSION}-amd64.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu
          path: dist/*.deb
          if-no-files-found: error

  fedora:
    name: Fedora (rpm)
    runs-on: ubuntu-latest
    container:
      image: fedora:37
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ pkgconf-pkg-config \
            qt6-qtbase-devel qt6-qtdeclarative-devel libX11-devel systemd-devel \
            rpm-build

      - name: Update spec version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_number="${VERSION#v}"
          sed -i "s/^Version:.*/Version:        ${version_number}/" resource/fedora/worktime.spec

      - name: Build source tarball
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_number="${VERSION#v}"
          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS

          tar -czf "rpmbuild/SOURCES/v${version_number}.tar.gz" \
            --exclude-vcs --exclude=./rpmbuild \
            --transform "s|^\./|WorkTime-${version_number}/|" \
            .
          cp resource/fedora/worktime.spec rpmbuild/SPECS/worktime.spec

      - name: Build package
        run: rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/worktime.spec

      - name: Rename package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp rpmbuild/RPMS/x86_64/*.rpm "dist/worktime-${VERSION}-x86_64.rpm"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fedora
          path: dist/*.rpm
          if-no-files-found: error

  arch:
    name: Arch Linux
    runs-on: ubuntu-22.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed cmake make pkgconf gcc fakeroot debugedit qt6-base qt6-declarative libx11 systemd-libs git

      - name: Update pkgver and checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version_number="${VERSION#v}"
          checksum=$(curl -sL "https://github.com/filesfm/WorkTime/archive/refs/tags/${VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=${version_number}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=('.*')/sha256sums=('${checksum}')/" \
            resource/arch/PKGBUILD

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder resource/arch
          su builder -c 'cd resource/arch && makepkg --noconfirm'

      - name: Rename package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp resource/arch/*.pkg.tar.zst "dist/worktime-${VERSION}-x86_64.pkg.tar.zst"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Publish release
    needs: [appimage, flatpak, snap, macos, windows, ubuntu, fedora, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          fail_on_unmatched_files: true
