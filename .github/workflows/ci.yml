name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        include:
          - os: ubuntu-latest
            qt_arch: linux_gcc_64
            qt_version: '6.8.1'
            ccache_variant: ccache
          - os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_version: '6.8.1'
            ccache_variant: ''
          - os: macos-latest
            qt_arch: clang_64
            qt_version: '6.11.1'
            ccache_variant: ccache

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon0 libudev-dev

      - name: Install Qt
        uses: ./.github/actions/install-qt
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}

      - name: Install KF6 IdleTime
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/install-kf6-idletime

      - name: ccache
        if: matrix.os != 'windows-latest'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.build_type }}
          variant: ${{ matrix.ccache_variant }}
          max-size: 300M

      - name: Configure
        run: >
          cmake -S . -B build/${{ matrix.build_type }} -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=${{ matrix.ccache_variant }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ matrix.ccache_variant }}

      - name: Build
        run: cmake --build build/${{ matrix.build_type }}

      - name: Run qmllint
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: qmllint -I build/${{ matrix.build_type }}/src src/qml/Main.qml

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/${{ matrix.build_type }} --output-on-failure

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worktime-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/${{ matrix.build_type }}/bin
          if-no-files-found: error

  sanitize:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon0 libudev-dev

      - name: Install Qt
        uses: ./.github/actions/install-qt
        with:
          version: '6.8.1'
          arch: linux_gcc_64

      - name: Install KF6 IdleTime
        uses: ./.github/actions/install-kf6-idletime

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: sanitize
          variant: ccache
          max-size: 300M

      - name: Configure (ASan + UBSan + LSan)
        run: >
          cmake -S . -B build/Sanitize-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,leak -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,leak"

      - name: Build (ASan + UBSan + LSan)
        run: cmake --build build/Sanitize-asan

      - name: Test (ASan + UBSan + LSan)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build/Sanitize-asan --output-on-failure

      - name: Configure (TSan)
        run: >
          cmake -S . -B build/Sanitize-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build (TSan)
        run: cmake --build build/Sanitize-tsan

      - name: Test (TSan)
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/Sanitize-tsan --output-on-failure

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud's new-code/blame analysis needs full history.
          fetch-depth: 0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon0 libudev-dev gcovr

      - name: Install Qt
        uses: ./.github/actions/install-qt
        with:
          version: '6.8.1'
          arch: linux_gcc_64

      - name: Install KF6 IdleTime
        uses: ./.github/actions/install-kf6-idletime

      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: sonar
          max-size: 300M

      - name: Configure
        run: >
          cmake -S . -B build/Sonar -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DENABLE_COVERAGE=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/Sonar

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/Sonar --output-on-failure

      - name: Generate coverage report
        run: >
          gcovr --root . --filter 'src/' --exclude-unreachable-branches
          --sonarqube --output build/Sonar/coverage-sonarqube.xml build/Sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@689fb39b34b9aa95ebc5f8f119343ddd51542402 # v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install actionlint
        env:
          ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -sL -o actionlint.tar.gz "$ACTIONLINT_URL"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Run actionlint
        run: actionlint

      - name: Install shellcheck
        env:
          SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          curl -sL -o shellcheck.tar.xz "$SHELLCHECK_URL"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar xf shellcheck.tar.xz shellcheck-v0.10.0/shellcheck
          sudo mv shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck

      - name: Run shellcheck
        run: shellcheck hooks/pre-commit hooks/pre-push hooks/lib.sh .github/scripts/*.sh .github/scripts/packages/*.sh

      - name: Install yamllint
        run: pip install --quiet yamllint==1.38.0

      - name: Run yamllint
        run: yamllint .

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.15.0 "README.md" "AGENTS.md"

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability, secret, misconfiguration and license scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e4d2851c4593439ac10bdcd57c5b06cac73b4775 # v3.37.8
        with:
          sarif_file: trivy-results.sarif
