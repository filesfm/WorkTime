name: Generate and Deploy Doxygen Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  doxygen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz libudev-dev

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@8b297075da4cd2a5f1fd21fe011b499edf06e9d2 # v4

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: '6.8.1'
          arch: linux_gcc_64
          modules: 'qtshadertools'
          cache: true

      - name: Install KF6 IdleTime from Ubuntu archive
        run: |
          prefix="$RUNNER_TEMP/kf6-idletime"
          base=http://archive.ubuntu.com/ubuntu/pool/universe/k/kf6-kidletime
          version=6.12.0-0ubuntu1
          mkdir -p "$prefix"
          for pkg in libkf6idletime-dev libkf6idletime6; do
            curl -fsSL -o "$RUNNER_TEMP/$pkg.deb" "$base/${pkg}_${version}_amd64.deb"
            dpkg-deb -x "$RUNNER_TEMP/$pkg.deb" "$prefix"
          done
          echo "CMAKE_PREFIX_PATH=$prefix/usr${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_DOCS=ON -DBUILD_TESTING=OFF

      - name: Generate Doxygen documentation
        run: cmake --build build --target docs

      - name: Check generated files
        run: ls -lR build/docs/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/html
          publish_branch: gh-pages
