name: Install KF6 IdleTime
description: Install KF6 IdleTime from the Ubuntu archive and expose it to CMake and the linker

runs:
  using: composite
  steps:
    - name: Install KF6 IdleTime from Ubuntu archive
      shell: bash
      run: |
        prefix="$RUNNER_TEMP/kf6-idletime"
        base=http://archive.ubuntu.com/ubuntu/pool/universe/k/kf6-kidletime
        version=6.12.0-0ubuntu1
        mkdir -p "$prefix"
        for pkg in libkf6idletime-dev libkf6idletime6; do
          curl -fsSL -o "$RUNNER_TEMP/$pkg.deb" "$base/${pkg}_${version}_amd64.deb"
          dpkg-deb -x "$RUNNER_TEMP/$pkg.deb" "$prefix"
        done
        echo "CMAKE_PREFIX_PATH=$prefix/usr${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$prefix/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
