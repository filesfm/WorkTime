version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/install-qt"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"
