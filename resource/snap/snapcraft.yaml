name: files-fm-worktime
license: Apache-2.0
base: core24
adopt-info: worktime
summary: A Qt6/QML desktop time-tracking app
description: |
  WorkTime tracks working time with a simple Start/Stop button. It uses a
  system tray icon when one is available on the current desktop, falling
  back to a normal always-visible window otherwise, and configures a small
  settings table (server credentials, post interval, screenshot capture
  options).
grade: stable
confinement: strict

apps:
  files-fm-worktime:
    command: usr/bin/worktime
    common-id: io.github.filesfm.worktime
    desktop: usr/share/applications/io.github.filesfm.worktime.desktop
    extensions:
      - kde-neon-6
    plugs:
      - network
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl

parts:
  worktime:
    plugin: cmake
    # snap/snapcraft.yaml at the repo root is a symlink to this file, so
    # snapcraft treats the repo root as the project directory and `.`
    # resolves there.
    source: .
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags --always)"
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - libx11-dev

  desktop-assets:
    plugin: dump
    source: .
    organize:
      resource/io.github.filesfm.worktime.desktop: usr/share/applications/io.github.filesfm.worktime.desktop
      resource/icon.svg: usr/share/icons/hicolor/scalable/apps/io.github.filesfm.worktime.svg
      resource/icon.png: usr/share/icons/hicolor/128x128/apps/io.github.filesfm.worktime.png
      resource/io.github.filesfm.worktime.metainfo.xml: usr/share/metainfo/io.github.filesfm.worktime.metainfo.xml
    stage:
      - usr/share/applications/io.github.filesfm.worktime.desktop
      - usr/share/icons/hicolor/scalable/apps/io.github.filesfm.worktime.svg
      - usr/share/icons/hicolor/128x128/apps/io.github.filesfm.worktime.png
      - usr/share/metainfo/io.github.filesfm.worktime.metainfo.xml
