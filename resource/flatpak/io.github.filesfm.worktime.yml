app-id: io.github.filesfm.worktime
runtime: org.kde.Platform
runtime-version: '6.7'
sdk: org.kde.Sdk
command: worktime

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: worktime
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
    post-install:
      - install -Dm644 resource/io.github.filesfm.worktime.metainfo.xml
        /app/share/metainfo/io.github.filesfm.worktime.metainfo.xml
      - install -Dm644 resource/icon.svg
        /app/share/icons/hicolor/scalable/apps/io.github.filesfm.worktime.svg
      - install -Dm644 resource/io.github.filesfm.worktime.desktop
        /app/share/applications/io.github.filesfm.worktime.desktop
